
name: Autogen

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Link direto do payload.zip no Google Drive"
        required: true
        type: string

permissions:
  contents: write

jobs:
  autogen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar estrutura do projeto
        run: |
          echo "=== Raiz do repositório ==="
          ls -la
          echo "=== Conteúdo de autogen ==="
          if [ -d autogen ]; then
            find autogen -maxdepth 3 -type f -print
          else
            echo "ERRO: pasta autogen não encontrada."
            exit 1
          fi

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip xmlstarlet
          python -m pip install --upgrade gdown

      - name: Baixar payload
        env:
          PAYLOAD_URL: ${{ inputs.payload }}
        run: |
          mkdir -p autogen/input
          gdown "$PAYLOAD_URL" -O autogen/input/payload.zip
          if [ ! -s autogen/input/payload.zip ]; then
            echo "ERRO: o download está vazio."
            exit 1
          fi
          file autogen/input/payload.zip
          unzip -t autogen/input/payload.zip

      - name: Extrair payload
        run: |
          unzip -o autogen/input/payload.zip -d autogen/input/
          rm autogen/input/payload.zip
          echo "=== Arquivos extraídos ==="
          find autogen/input -maxdepth 5 -type f -print

      - name: Localizar arquivos necessários
        run: |
          echo "=== Procurando config.xml e ROM ==="
          find autogen/input -type f \( \
            -iname "config.xml" -o \
            -iname "*.gba" \
          \) -print

          if ! find autogen/input -type f -iname "config.xml" | grep -q .; then
            echo "AVISO: config.xml não foi encontrado."
          fi

          if ! find autogen/input -type f -iname "*.gba" | grep -q .; then
            echo "AVISO: nenhum arquivo .gba foi encontrado."
          fi

      - name: Executar gerador
        id: generator
        continue-on-error: true
        run: |
          chmod +x autogen/generate
          set +e
          ./autogen/generate 2>&1 | tee generator.log
          result=${PIPESTATUS[0]}
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Diagnosticar resultado
        if: always()
        run: |
          echo "=== Resultado do gerador ==="
          echo "Código de saída: ${{ steps.generator.outputs.exit_code }}"
          echo "=== Diretório atual ==="
          pwd
          echo "=== Estrutura de autogen ==="
          find autogen -maxdepth 5 -print
          echo "=== Diretórios chamados output ==="
          find . -type d -iname "*output*" -print
          echo "=== Arquivos ZIP gerados ==="
          find . -type f -iname "*.zip" -print
          echo "=== Últimas linhas do log ==="
          if [ -f generator.log ]; then
            tail -n 150 generator.log
          fi

      - name: Confirmar arquivos gerados
        run: |
          if [ "${{ steps.generator.outputs.exit_code }}" != "0" ]; then
            echo "ERRO: o gerador falhou. Consulte o log acima."
            exit 1
          fi

          if [ ! -d autogen/output ]; then
            echo "ERRO: autogen/output não existe."
            echo "O diagnóstico anterior mostra onde o gerador colocou os arquivos."
            exit 1
          fi

          if ! find autogen/output -type f | grep -q .; then
            echo "ERRO: a pasta de saída está vazia."
            exit 1
          fi

      - name: Compactar resultado
        run: |
          cd autogen/output
          zip -r9 ../output.zip .
          cd ../..
          test -s autogen/output.zip

      - name: Criar release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ludere-autogen-${{ github.run_id }}
          name: "Ludere Autogen ${{ github.run_id }}"
          files: autogen/output.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

